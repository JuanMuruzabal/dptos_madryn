# Levanta la aplicación completa: Postgres + API (Go) + web (Next.js).
# `docker compose up --build` alcanza para tener todo corriendo, sin
# instalar Go/Node/pnpm en la máquina — pensado para reproducibilidad
# entre desarrolladores, no como definición de infra de producción.
#
# Variables opcionales en un `.env` junto a este archivo (ver
# .env.example): JWT_SECRET, CONTACTO_WHATSAPP, CONTACTO_EMAIL,
# TURNSTILE_SECRET_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY, RESEND_API_KEY,
# RESEND_FROM_EMAIL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# NEXT_PUBLIC_GOOGLE_CLIENT_ID.

services:
  postgres:
    image: postgres:16
    container_name: turismo-marcuzzi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
      POSTGRES_DB: turismo_marcuzzi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo_marcuzzi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de un solo disparo: aplica el esquema (AutoMigrate + SQL
  # crudo del exclusion constraint, ver apps/api/internal/db/migrate.go)
  # y termina. Es idempotente (T0.3) — se puede correr de nuevo en cada
  # `docker compose up` sin romper nada. Nota: desde TR-042, el propio
  # CMD de apps/api/Dockerfile también corre `/app/migrate` en su
  # arranque (necesario para Render, cuyo plan free no soporta
  # `preDeployCommand`) — este servicio aparte sigue existiendo porque
  # documenta el paso de forma explícita en el grafo de dependencias de
  # Compose; correr la migración dos veces es redundante pero inofensivo
  # (idempotente).
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: turismo-marcuzzi-migrate
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://turismo:turismo@postgres:5432/turismo_marcuzzi?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: turismo-marcuzzi-api
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgres://turismo:turismo@postgres:5432/turismo_marcuzzi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      # Storage local (TR-013): /app/uploads vive en el volumen
      # api_uploads para persistir entre reinicios del contenedor.
      UPLOADS_DIR: /app/uploads
      # http://localhost:8080 (no "api:8080") porque esta URL la resuelve
      # el NAVEGADOR al pedir la imagen, no el contenedor — y el puerto
      # 8080 del servicio api está publicado al host más abajo.
      UPLOADS_BASE_URL: http://localhost:8080/uploads
      # CAPTCHA del registro (Cloudflare Turnstile, TR-047) — sin setear,
      # config.go ya cae al secret key de PRUEBA público de Cloudflare.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      # Confirmación de cuenta por email y "Ingresá con Google" (Prompt 2,
      # 2026-08-18) — vacíos por defecto (LogSender/Google deshabilitado,
      # ver .env.example); si tenés credenciales reales en tu propio .env
      # de la raíz, se reenvían acá tal cual.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Bug real (2026-08-18, ver el comentario en apps/web/Dockerfile):
      # las NEXT_PUBLIC_* necesitan existir en el momento del BUILD, no
      # solo en el `environment:` del contenedor ya corriendo — sin esto,
      # `docker compose up --build` siempre compilaba con los fallbacks
      # hardcodeados, ignorando cualquier valor real puesto en el .env de
      # la raíz.
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: turismo-marcuzzi-web
    restart: unless-stopped
    environment:
      PORT: 3000
      # http://api:8080 (nombre del servicio, resuelto por la red interna
      # de Docker) porque esta URL la usa el SERVIDOR de Next (Server
      # Components/Actions, apps/web/src/lib/api.ts) para hablarle a la
      # API — a diferencia de UPLOADS_BASE_URL arriba, esto nunca lo
      # resuelve el navegador.
      API_URL: http://api:8080
      CONTACTO_WHATSAPP: ${CONTACTO_WHATSAPP:-5492804000000}
      CONTACTO_EMAIL: ${CONTACTO_EMAIL:-hola@turismomarcuzzi.com.ar}
      # Par público de TURNSTILE_SECRET_KEY de arriba (ver comentario ahí).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      # Par público de GOOGLE_CLIENT_ID del servicio api (Prompt 2) — vacío
      # por defecto, el botón de Google queda visible pero deshabilitado.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:

services:
  postgres:
    image: postgres:16
    container_name: turismo-marcuzzi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
      POSTGRES_DB: turismo_marcuzzi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo_marcuzzi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

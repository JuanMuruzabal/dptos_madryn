name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:web

      - name: Typecheck (web)
        run: pnpm run typecheck:web

      - name: Typecheck (shared-types)
        run: pnpm run typecheck:shared-types

      - name: Build
        run: pnpm run build:web

  api:
    name: api (vet + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: apps/api
          version: latest

      - name: Build
        run: go build ./...
